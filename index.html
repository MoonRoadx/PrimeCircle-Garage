    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCBv76jskiMzjEYmdEAy3ZaDrZFDjQJcsg",
      authDomain: "prime-client-serveur.firebaseapp.com",
      projectId: "prime-client-serveur",
      storageBucket: "prime-client-serveur.firebasestorage.app",
      messagingSenderId: "164158368187",
      appId: "1:164158368187:web:1fb7105414d198680bfc9e",
      measurementId: "G-BPF3MEJJ8V"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    // Enable offline persistence
    try {
      await enableIndexedDbPersistence(db);
      console.log("✅ Mode hors ligne activé");
    } catch (err) {
      if (err.code === 'failed-precondition') {
        console.warn("⚠️ Plusieurs onglets ouverts - persistance désactivée");
      } else if (err.code === 'unimplemented') {
        console.warn("⚠️ Navigateur non supporté pour la persistance");
      } else {
        console.error("❌ Erreur persistance:", err);
      }
    }

    // Expose Firebase globally
    window.firebaseDB = db;
    window.firebaseApp = app;
    window.firebaseReady = true;
    console.log("✅ Firebase initialized");
    window.dispatchEvent(new Event('firebaseReady'));

    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('✅ Service Worker registered'))
        .catch(err => console.log('❌ SW registration failed:', err));
    }
  </script>

    // URL du fichier JSON sur GitHub

    // Données du garage

    // Traductions (conservez vos traductions existantes)
    const translations = {

      pwa: { /* ... vos traductions existantes ... */ }

    // Variables globales
    let currentLang = localStorage.getItem('app_language') || 'it';
    let vehicles = {}, currentVehicle = null, showAddForm = false, isMechanicMode = false, isClientMode = false;
    let showLoginScreen = true, searchQuery = '', showShareModal = false, shareModalTarga = null;
    let realtimeUnsubscribe = null, showAppointmentForm = false, showDashboard = false;
    let showAdvancedSearch = false, filters = { date: '', type: '', mechanic: '', costMin: '', costMax: '' };
    let isOffline = !navigator.onLine;
    let deferredPrompt = null;

    // Fonction pour charger les données des véhicules depuis GitHub
    async function loadVehicleDatabase() {
      try {
        // 1. Vérifier le cache local
        const cachedData = localStorage.getItem('vehicleDatabase');
        if (cachedData) {
          vehicleDatabase = JSON.parse(cachedData);
          console.log("✅ Vehicle database loaded from cache");
          return;
        }

        // 2. Charger depuis GitHub
        console.log("Tentative de chargement depuis GitHub...");
        const response = await fetch(GITHUB_VEHICLES_URL);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        vehicleDatabase = await response.json();
        localStorage.setItem('vehicleDatabase', JSON.stringify(vehicleDatabase));
        console.log("✅ Vehicle database loaded from GitHub");
      } catch (error) {
        console.error("❌ Error loading vehicle database from GitHub:", error);
        // Liste de secours en cas d'échec
        vehicleDatabase = {
          "Fiat": ["Panda", "500", "Punto", "Tipo", "Doblò"],
          "Volvo": ["XC40", "XC60", "XC90", "S60", "S90"],
          "Other": ["Autre (préciser)"]
        };
        showNotification(`⚠️ ${t('offlineMode')} - ${t('noResults')}`, 'warning');
      }
    }

    // Fonction pour mettre à jour les modèles
    function updateModels() {
      const brandSelect = document.getElementById('newVehicleMarca');
      const modelSelect = document.getElementById('newVehicleModello');
      const otherModelInput = document.getElementById('otherModelInput');
      const selectedBrand = brandSelect.value;

      modelSelect.innerHTML = '';
      otherModelInput.style.display = 'none';

      if (selectedBrand && vehicleDatabase[selectedBrand]) {
        modelSelect.disabled = false;
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = t('selectModel');
        placeholder.disabled = true;
        placeholder.selected = true;
        modelSelect.appendChild(placeholder);

        vehicleDatabase[selectedBrand].forEach(model => {
          const option = document.createElement('option');
          option.value = model;
          option.textContent = model;
          modelSelect.appendChild(option);
        });

        const otherOption = document.createElement('option');
        otherOption.value = 'other';
        otherOption.textContent = t('otherModel');
        modelSelect.appendChild(otherOption);
      } else if (selectedBrand === 'other') {
        modelSelect.disabled = true;
        otherModelInput.style.display = 'block';
        otherModelInput.value = '';
      } else {
        modelSelect.disabled = true;
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = t('selectBrandFirst');
        placeholder.disabled = true;
        placeholder.selected = true;
        modelSelect.appendChild(placeholder);
      }
    }

    function handleModelChange() {
      const modelSelect = document.getElementById('newVehicleModello');
      const otherModelInput = document.getElementById('otherModelInput');
      if (modelSelect.value === 'other') {
        otherModelInput.style.display = 'block';
        otherModelInput.value = '';
      } else {
        otherModelInput.style.display = 'none';
      }
    }

    // Fonction pour obtenir le sélecteur de langue
    function t(key) { return translations[currentLang][key] || translations.it[key] || key; }
    function setLanguage(lang) { currentLang = lang; localStorage.setItem('app_language', lang); render(); }
    function getLanguageSelector() {
      return `<select onchange="setLanguage(this.value)" class="px-3 py-2 rounded-lg text-sm font-semibold bg-gray-700 text-white border-2 border-gray-600 hover:bg-gray-600 cursor-pointer" style="background-color: rgba(55,65,81,0.95) !important; color: white !important;">
        <option value="it" ${currentLang === 'it' ? 'selected' : ''}>🇮🇹 Italiano</option>
        <option value="fr" ${currentLang === 'fr' ? 'selected' : ''}>🇫🇷 Français</option>
        <option value="en" ${currentLang === 'en' ? 'selected' : ''}>🇬🇧 English</option>
      </select>`;
    }

    // Fonctions utilitaires (conservez vos fonctions existantes)
    function showNotification(message, type = 'success') {
      const notification = document.createElement('div');
      notification.className = `notification ${type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white`;
      notification.textContent = message;
      document.body.appendChild(notification);
      setTimeout(() => { notification.style.animation = 'slideIn 0.3s ease-out reverse'; setTimeout(() => notification.remove(), 300); }, 3000);
    }

    function showSyncIndicator(message = "🔄 Synchronisation...") {
      const existing = document.getElementById('syncIndicator');
      if (existing) existing.remove();

      const indicator = document.createElement('div');
      indicator.id = 'syncIndicator';
      indicator.className = 'fixed top-20 right-4 bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg z-50 flex items-center gap-2';
      indicator.innerHTML = `
        <div class="loading" style="width: 16px; height: 16px; border-width: 2px;"></div>
        <span class="text-sm">${message}</span>
      `;
      document.body.appendChild(indicator);

      setTimeout(() => indicator.remove(), 2000);
    }

    // Fonction d'initialisation
    async function init() {
      // 1. Charger les données des véhicules depuis GitHub
      await loadVehicleDatabase();

      // 2. Charger les données locales ou Firebase
      loadDataLocal();
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        const targa = verifyClientCode(code);
        if (targa) {
          isClientMode = true;
          isMechanicMode = false;
          showLoginScreen = false;
          currentVehicle = targa;
          window.history.replaceState({}, document.title, window.location.pathname);

          if (USE_FIREBASE && !window.firebaseReady) {
            await new Promise(resolve => {
              window.addEventListener('firebaseReady', resolve, { once: true });
            });
          }

          if (USE_FIREBASE) {
            const vehicleData = await loadFromFirestore(targa, true);
            if (vehicleData) {
              vehicles[targa] = vehicleData;
              saveDataLocal();
              showNotification(`✅ ${t('autoAccess')} - ${t('realtimeActive')}`);
            }
          }
        }
      }

      // 3. Rendre l'interface
      render();
      initModeTheme();

      // 4. Gestion du mode hors ligne
      window.addEventListener('online', () => {
        isOffline = false;
        showOfflineIndicator();
        if (isClientMode && currentVehicle && USE_FIREBASE) {
          loadFromFirestore(currentVehicle, true);
        }
      });

      window.addEventListener('offline', () => {
        isOffline = true;
        showOfflineIndicator();
      });
    }

    // Fonction de rendu (conservez votre fonction existante, mais mettez à jour la partie des marques dynamiques)
    function render() {

      // ... (conservez tout votre code de rendu existant, sauf la partie suivante) ...

        const brandOptions = Object.keys(vehicleDatabase)
          .sort()
          .map(brand => `<option value="${brand}">${brand}</option>`)
          .join('');

        app.innerHTML = `

              <div class="bg-white rounded-lg shadow p-4 mb-4">

                <div class="space-y-3">
                  <input type="text" id="newVehicleTarga" placeholder="${t('plate')} *" class="w-full px-3 py-2 border rounded uppercase font-bold">
                  <select id="newVehicleMarca" onchange="updateModels()" class="w-full px-3 py-2 border rounded bg-gray-800 text-white border-gray-600">
                    <option value="">${t('selectBrand')}</option>
                    ${brandOptions}
                    <option value="other">--- ${t('typeOther')} ---</option>
                  </select>
                  <!-- ... (conservez le reste de votre formulaire) ... -->
                </div>
              </div>
              <!-- ... (conservez le reste de votre HTML) ... -->
            </div>
          </div>`;
      }
      // ... (conservez le reste de votre fonction render) ...
    }

    // Fonction pour initialiser le mode sombre/clair
    function initModeTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
      }
      updateThemeIcon();
    }

    // Fonction pour basculer entre les thèmes
    function toggleTheme() {
      document.body.classList.add('transitioning');
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      updateThemeIcon();
      showNotification(isLight ? '☀️ Mode clair activé' : '🌙 Mode sombre activé');
      setTimeout(() => {
        document.body.classList.remove('transitioning');
      }, 300);
    }

    // Fonction pour mettre à jour l'icône du thème
    function updateThemeIcon() {
      const themeButton = document.getElementById('themeToggle');
      if (!themeButton) return;
      const isLight = document.body.classList.contains('light-mode');
      if (themeButton.querySelector('.theme-icon')) {
        themeButton.querySelector('.theme-icon').textContent = isLight ? '🌙' : '☀️';
      }
    }

    // Fonction pour ajouter le bouton de thème
    function addThemeToggleButton() {
      const existingButton = document.getElementById('themeToggle');
      if (existingButton) return;

      const button = document.createElement('div');
      button.id = 'themeToggle';
      button.className = 'theme-toggle';
      button.onclick = toggleTheme;
      button.innerHTML = '<span class="theme-icon">☀️</span>';
      button.title = 'Changer de thème';
      document.body.appendChild(button);
      updateThemeIcon();
    }

    // Initialisation
    init();
